<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph of text -->
    <p>This is a simple paragraph of text on my new HTML page.</p>

    <!-- An Image (replace with a real image URL if you have one) -->
    <img src="https://placeholder.com" alt="Placeholder Image" width="150" height="150">

    <!-- A Hyperlink pointing to another site -->
    <p>Visit <a href="https://www.w3schools.com" target="_blank">W3Schools</a> for great tutorials.</p>

    <!-- An Unordered List -->
    <h2>My Favorite Fruits</h2>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

</body>
</html>
